<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Guide">
<title>Gym Field Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EDF0EF; --surface:#FFFFFF; --surface-2:#F4F6F5; --stage:#F7F9F8;
  --ink:#1B2025; --ink-2:#4B555E; --line:#D3D9D8; --bar-bg:rgba(237,240,239,.88);
  --fig:#2A323A; --fig-far:#A9B2B8; --eq:#8E989F; --eq-strong:#58626B; --eq-fill:#E2E7E6; --floor:#E6EAE9;
  --plate-fill:rgba(88,98,107,.13);
  --d1:#D0342C; --d1-ink:#B02A23; --d1-on:#FFFFFF;
  --d2:#2563C9; --d2-ink:#1D52AA; --d2-on:#FFFFFF;
  --d3:#E3A512; --d3-ink:#865C00; --d3-on:#1B2025;
  --add:#2E8A4F; --add-ink:#23733F;
  --accent:var(--d1); --accent-ink:var(--d1-ink); --on-accent:var(--d1-on);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15181B; --surface:#1E2226; --surface-2:#262B30; --stage:#1A1E21;
    --ink:#E8ECEE; --ink-2:#A8B1B8; --line:#343B42; --bar-bg:rgba(21,24,27,.86);
    --fig:#DCE2E6; --fig-far:#5F6971; --eq:#6E7981; --eq-strong:#9BA6AE; --eq-fill:#2B3136; --floor:#1F2427;
    --plate-fill:rgba(200,210,216,.10);
    --d1:#F05A4F; --d1-ink:#FF8279; --d1-on:#1A0D0C;
    --d2:#5B95F2; --d2-ink:#8DB4F7; --d2-on:#0B1424;
    --d3:#F2BE33; --d3-ink:#F5C94F; --d3-on:#1E1702;
    --add:#4DBA74; --add-ink:#72CD93;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15181B; --surface:#1E2226; --surface-2:#262B30; --stage:#1A1E21;
  --ink:#E8ECEE; --ink-2:#A8B1B8; --line:#343B42; --bar-bg:rgba(21,24,27,.86);
  --fig:#DCE2E6; --fig-far:#5F6971; --eq:#6E7981; --eq-strong:#9BA6AE; --eq-fill:#2B3136; --floor:#1F2427;
  --plate-fill:rgba(200,210,216,.10);
  --d1:#F05A4F; --d1-ink:#FF8279; --d1-on:#1A0D0C;
  --d2:#5B95F2; --d2-ink:#8DB4F7; --d2-on:#0B1424;
  --d3:#F2BE33; --d3-ink:#F5C94F; --d3-on:#1E1702;
  --add:#4DBA74; --add-ink:#72CD93;
}
[data-day="1"]{--accent:var(--d1);--accent-ink:var(--d1-ink);--on-accent:var(--d1-on)}
[data-day="2"]{--accent:var(--d2);--accent-ink:var(--d2-ink);--on-accent:var(--d2-on)}
[data-day="3"]{--accent:var(--d3);--accent-ink:var(--d3-ink);--on-accent:var(--d3-on)}

*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1080px;margin:0 auto;height:60px;padding:0 12px 0 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 22px/1 var(--display);letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.spacer{flex:1}
.barbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink);transition:background-color .2s}
.barbtn:hover{background:var(--surface-2)}
.barbtn.back{padding-left:4px}
.counter{font:600 15px/1 var(--body);color:var(--ink-2);padding-right:6px}
.segbar{display:flex;gap:3px;max-width:1080px;margin:0 auto;padding:0 16px 10px}
.segbar a{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background-color .2s}
.segbar a.done{background:var(--accent);opacity:.45}
.segbar a.cur{background:var(--accent);opacity:1}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

.pl{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 4px rgba(255,255,255,.28)}
.pl.d1{--c:var(--d1)}.pl.d2{--c:var(--d2)}.pl.d3{--c:var(--d3)}

/* day hero */
.dayhero{display:grid;grid-template-columns:1fr;gap:16px;padding:28px 0 20px}
.dayhero h1{font:700 clamp(40px,11vw,64px)/.92 var(--display);letter-spacing:-.005em}
.dayhero h1 small{display:block;font:600 18px/1.2 var(--body);color:var(--accent-ink);letter-spacing:0;margin-bottom:8px}
.dayhero .facts{color:var(--ink-2);margin-top:10px}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog .bar{flex:1 1 180px;height:10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.prog .txt{font:600 15px/1.2 var(--body);color:var(--ink-2);min-width:130px}
@media (min-width:760px){.dayhero{grid-template-columns:1fr auto;align-items:end}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;border:1.5px solid transparent;text-decoration:none;font:600 17px/1 var(--body);transition:background-color .2s,border-color .2s,opacity .2s;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--eq)}
.btn.wide{width:100%}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

/* list */
.group{margin-top:22px}
.group h2{font:700 24px/1.1 var(--display);margin:0 0 10px 2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:116px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px 10px 10px;text-decoration:none;border-top:1px solid var(--line);transition:background-color .2s}
.list>.row:first-child,.list>.ss:first-child>.ss-h{border-top:0}
.row:hover{background:var(--surface-2)}
.row canvas{display:block;width:116px;aspect-ratio:16/11;border-radius:10px;background:var(--stage)}
.row .nm{font:600 21px/1.1 var(--display)}
.row .meta{font-size:14px;line-height:1.35;color:var(--ink-2);margin-top:3px}
.row .meta b{font-weight:600;color:var(--ink)}
.row .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font:600 14px/1 var(--body);color:var(--ink-2);min-width:34px}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--eq)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.row.complete .nm{color:var(--ink-2)}
.tagadd{display:inline-block;font:600 12px/1 var(--body);color:var(--add-ink);border:1.5px solid var(--add);border-radius:6px;padding:3px 6px;margin-left:6px;vertical-align:3px}
.ss{position:relative;border-top:1px solid var(--line)}
.ss-h{display:flex;align-items:center;gap:8px;padding:10px 14px 0 14px;font-size:14px;font-weight:600;color:var(--accent-ink)}
.ss-h svg{width:18px;height:18px}
.ss .row{border-top:0}
.ss::before{content:"";position:absolute;left:4px;top:40px;bottom:14px;width:3px;border-radius:2px;background:var(--accent)}
.basics-link{display:flex;align-items:center;gap:14px;margin:28px 0 40px;padding:16px;border-radius:16px;border:1.5px dashed var(--line);text-decoration:none;transition:border-color .2s}
.basics-link:hover{border-color:var(--eq)}
.basics-link b{display:block;font:700 20px/1.1 var(--display)}
.basics-link span{font-size:14px;color:var(--ink-2)}

/* detail */
.detail{max-width:1080px;margin:0 auto;padding:14px 16px 170px}
.stage{position:relative;border-radius:20px;background:var(--stage);border:1px solid var(--line);overflow:hidden}
.stage canvas{display:block;width:100%;aspect-ratio:16/11;touch-action:manipulation}
.cue .ctrls{display:flex;gap:8px;margin-left:auto;flex:none}
.ibtn{display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:600 15px/1 var(--body);transition:border-color .2s}
.ibtn:hover{border-color:var(--eq)}
.viewlbl{position:absolute;top:14px;left:14px;font-size:13px;font-weight:500;color:var(--ink-2)}
.cue{display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 16px 0;border-top:1px solid var(--line);background:var(--surface)}
.cue strong{font:600 23px/1.12 var(--display)}
.ttxt{padding:0 16px 14px;background:var(--surface);font-size:14px;color:var(--ink-2)}
.tempo{position:relative;display:flex;gap:4px;height:8px;margin:0;padding:10px 16px 10px;background:var(--surface);box-sizing:content-box}
.tempo span{flex:var(--w) 1 0;border-radius:4px;background:var(--line);transition:background-color .15s}
.tempo span.on{background:var(--accent)}
.tempo .head{position:absolute;top:6px;left:16px;width:3px;height:16px;border-radius:2px;background:var(--ink)}

.dinfo{padding-top:18px}
.dinfo h1{font:700 clamp(32px,8.6vw,44px)/1 var(--display)}
.wrote{font-size:14px;color:var(--ink-2);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.add{border-color:var(--add);color:var(--add-ink)}

.tracker{margin-top:18px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow label{font-weight:600;margin-right:auto}
.step{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .2s}
.step:hover{border-color:var(--eq)}
.wt{width:84px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font:600 22px/1 var(--display)}
.unit{color:var(--ink-2);font-weight:600;width:22px}
.bw{color:var(--ink-2);font-size:15px}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.setbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);transition:background-color .2s,border-color .2s,color .2s}
.setbtn:hover{border-color:var(--eq)}
.setbtn b{font:700 20px/1 var(--display);white-space:nowrap}
.setbtn span{font-size:13px;color:var(--ink-2)}
.setbtn svg{width:18px;height:18px;display:none}
.setbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setbtn[aria-pressed="true"] span{color:inherit;opacity:.85}
.setbtn[aria-pressed="true"] svg{display:block}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:15px}
.nudge[hidden]{display:none}
.nudge a{flex:none}
.nudge .btn{min-height:42px;padding:0 14px;font-size:15px}

.sec{margin-top:26px}
.sec h2{font:700 24px/1.1 var(--display);margin-bottom:10px}
ol.steps{list-style:none;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;max-width:68ch}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent-ink);font:700 16px/1 var(--display)}
.tip{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--surface);border-left:4px solid var(--accent);max-width:68ch}
.where{max-width:68ch;color:var(--ink)}
.photos{margin-top:14px}
.photos .q{display:block;font-size:13px;color:var(--ink-2);margin-top:6px}

@media (min-width:900px){
  .detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start}
  .stagecol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
  .dinfo{padding-top:0}
}

.dnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dnav .in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.dnav .btn{min-height:52px}
.dnav .next{justify-content:space-between;overflow:hidden}
.dnav .next span{overflow:hidden;text-overflow:ellipsis}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:12;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(0);transition:transform .25s ease,opacity .25s ease}
.rest[hidden]{display:flex;opacity:0;transform:translateY(20px);pointer-events:none}
/* app shell */
html,body{overscroll-behavior-y:none}
a,button,input{touch-action:manipulation}
button,.tab,.row,.btn,.appbar,.setbtn,.ibtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.tabs #app{padding-bottom:84px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bar-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar[hidden]{display:none}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:56px;border-radius:12px;text-decoration:none;font:600 13px/1.1 var(--body);color:var(--ink-2);transition:color .2s,background-color .2s}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink)}
.tab .pl{width:20px;height:20px;opacity:.5;transition:opacity .2s}
.tab[aria-current="page"] .pl{opacity:1;outline:2px solid var(--c);outline-offset:2px}
.tab svg.i{width:22px;height:22px}
.enter-tab{animation:fadeIn .2s ease-out}
.enter-push{animation:pushIn .24s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pushIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.rest svg.ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.rest .ring circle{fill:none;stroke-width:5}
.rest .ring .bg{stroke:rgba(127,127,127,.35)}
.rest .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest .rt{flex:1;min-width:0}
.rest .rt b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.rest .rt span{font-size:13px;opacity:.8}
.rest button{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;font-weight:600;font-size:15px}
.rest button:hover{background:rgba(127,127,127,.18)}

/* basics */
.basics{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.basics h1{font:700 clamp(38px,10vw,56px)/.95 var(--display);margin-bottom:8px}
.basics .lede{color:var(--ink-2);margin-bottom:8px}
.basics section{padding:18px 0;border-top:1px solid var(--line)}
.basics section:first-of-type{border-top:0}
.basics h2{font:700 24px/1.1 var(--display);margin-bottom:8px}
.basics p{max-width:68ch}
.basics p+p{margin-top:10px}
.basics .note{font-size:14px;color:var(--ink-2)}
.themebar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.themebar button{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.themebar button[aria-pressed="true"]{border-color:var(--ink)}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body data-day="1">
<header class="appbar" id="bar"></header>
<main id="app"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
<div class="rest" id="rest" hidden role="status" aria-live="polite">
  <svg class="ring" viewBox="0 0 50 50" aria-hidden="true"><circle class="bg" cx="25" cy="25" r="21"/><circle class="fg" cx="25" cy="25" r="21" stroke-dasharray="131.95" stroke-dashoffset="0"/></svg>
  <div class="rt"><b id="restTime">1:30</b><span id="restMsg">Rest before your next set</span></div>
  <button type="button" id="restAdd">+15 s</button>
  <button type="button" id="restSkip">Skip</button>
</div>

<script>window.__PWA=true;</script>
<script>
"use strict";
/* =========================================================
   Geometry + figure engine
   ========================================================= */
const D2R=Math.PI/180;
const L={thigh:44,shin:42,foot:13,torso:50,neck:6,headR:9,uarm:29,farm:27};
const dir=a=>[Math.sin(a*D2R),Math.cos(a*D2R)];
const add=(p,v,s=1)=>[p[0]+v[0]*s,p[1]+v[1]*s];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
const len=v=>Math.hypot(v[0],v[1]);

function ik2(root,target,l1,l2,bend){
  const v=sub(target,root),d=len(v)||0.001;
  const dc=Math.max(Math.abs(l1-l2)+0.01,Math.min(l1+l2-0.01,d));
  const phi=Math.atan2(v[1],v[0]);
  const a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dc*dc-l2*l2)/(2*l1*dc))));
  let j=[root[0]+l1*Math.cos(phi+a),root[1]+l1*Math.sin(phi+a)];
  const cr=v[0]*(j[1]-root[1])-v[1]*(j[0]-root[0]);
  if(Math.sign(cr)!==Math.sign(bend)) j=[root[0]+l1*Math.cos(phi-a),root[1]+l1*Math.sin(phi-a)];
  const e=[root[0]+Math.cos(phi)*dc,root[1]+Math.sin(phi)*dc];
  return [j,e];
}
function limb(root,spec,l1,l2,J){
  if(!spec) return null;
  if(spec.a){const j=add(root,dir(spec.a[0]),l1);const e=add(j,dir(spec.a[1]),spec.l2??l2);return {root,j,e};}
  const t=typeof spec.ik==="function"?spec.ik(J):spec.ik;
  const [j,e]=ik2(root,t,spec.l1??l1,l2,spec.bend);return {root,j,e};
}
const footPts=(a,f)=>[add(a,dir(f),-3),add(a,dir(f),L.foot)];

function solveSide(p){
  const t=p.torso||0,tv=[Math.sin(t*D2R),-Math.cos(t*D2R)],front=[Math.cos(t*D2R),Math.sin(t*D2R)];
  const hip=p.hip,sh=add(hip,tv,L.torso);
  const ha=(t+(p.head||0))*D2R,hv=[Math.sin(ha),-Math.cos(ha)];
  const J={view:"side",p,hip,sh,tv,front,neck:add(sh,hv,L.neck),head:add(sh,hv,L.neck+L.headR)};
  const hipF=add(hip,[-2.5,-1]),shF=add(sh,[-2.5,-1]);
  J.legN=limb(hip,p.legs&&p.legs.near,L.thigh,L.shin,J);
  J.legF=limb(hipF,p.legs&&p.legs.far,L.thigh,L.shin,J);
  J.armN=limb(sh,p.arms&&p.arms.near,L.uarm,L.farm,J);
  J.armF=limb(shF,p.arms&&p.arms.far,L.uarm,L.farm,J);
  const fN=p.foot??90,fF=p.footF??fN;
  if(J.legN)J.legN.foot=footPts(J.legN.e,fN);
  if(J.legF)J.legF.foot=footPts(J.legF.e,fF);
  return J;
}
function solveFront(p){
  const c=p.hip,shY=c[1]-L.torso,SW=18;

  const dR=a=>[Math.sin(a*D2R),Math.cos(a*D2R)],dL=a=>[-Math.sin(a*D2R),Math.cos(a*D2R)];
  const arm=(s,d,sp)=>{const j=add(s,d(sp.a[0]),L.uarm);return {root:s,j,e:add(j,d(sp.a[1]),sp.l2??L.farm)};};
  const J={view:"front",p,hip:c,sh:[c[0],shY],shR,shL,neck:[c[0],shY-L.neck],head:[c[0],shY-L.neck-L.headR],dR,dL};
  J.armN=arm(shR,dR,p.arms);J.armF=arm(shL,dL,p.armsL||p.arms);
  if(p.seated){
    J.legs=[[[c[0]+9,c[1]],[c[0]+15,c[1]+8],[c[0]+16,195]],[[c[0]-9,c[1]],[c[0]-15,c[1]+8],[c[0]-16,195]]];
  }else{
    J.legs=[[[c[0]+8,c[1]],[c[0]+10,c[1]+44],[c[0]+11,195]],[[c[0]-8,c[1]],[c[0]-10,c[1]+44],[c[0]-11,195]]];
  }

}
function solveTop(p){
  const c=p.c,SW=20,shR=[c[0]+SW,c[1]],shL=[c[0]-SW,c[1]];
  const dR=a=>[Math.sin(a*D2R),-Math.cos(a*D2R)],dL=a=>[-Math.sin(a*D2R),-Math.cos(a*D2R)];
  const arm=(s,d,sp)=>{const j=add(s,d(sp.a[0]),L.uarm);return {root:s,j,e:add(j,d(sp.a[1]),sp.l2??L.farm)};};
  return {view:"top",p,c,shR,shL,head:[c[0],c[1]-2],armN:arm(shR,dR,p.arms),armF:arm(shL,dL,p.arms),dR,dL};
}
function solve(ex,p){return ex.view==="front"?solveFront(p):ex.view==="top"?solveTop(p):solveSide(p);}

/* drawing primitives */
function S(c,a,b,w,col){c.lineWidth=w;c.strokeStyle=col;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
function PL(c,pts,w,col){c.lineWidth=w;c.strokeStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.stroke();}
function CI(c,p,r,fill,stroke,w){c.beginPath();c.arc(p[0],p[1],r,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=w||2;c.strokeStyle=stroke;c.stroke();}}
function RR(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||1.5;c.strokeStyle=stroke;c.stroke();}}
function POLY(c,pts,fill,stroke,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=lw||1.5;c.strokeStyle=stroke;c.stroke();}}
function plateEnd(c,C,p,r){CI(c,p,r,C.plateFill,C.eqS,2.4);CI(c,p,r*.6,null,C.eq,1.2);CI(c,p,3.2,C.eqS);}
function hexDb(c,C,p,r=6.5){const pts=[];for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;pts.push([p[0]+r*Math.cos(a),p[1]+r*Math.sin(a)]);}POLY(c,pts,C.eqS,null);CI(c,p,2,C.stage);}
function dbAxis(c,C,p,a,half=11){const d=dir(a),n=dir(a+90);const e1=add(p,d,-half),e2=add(p,d,half);S(c,e1,e2,3,C.eqS);[e1,e2].forEach(e=>S(c,add(e,n,-5.5),add(e,n,5.5),6,C.eqS));}
function dbH(c,C,p,half=11){S(c,[p[0]-half,p[1]],[p[0]+half,p[1]],3,C.eqS);[-1,1].forEach(s=>S(c,[p[0]+s*half,p[1]-6],[p[0]+s*half,p[1]+6],6,C.eqS));}
function stack(c,C,x,yTop,yBot,lift,w=24){
  S(c,[x,yTop],[x,yBot],3,C.eq);S(c,[x+w,yTop],[x+w,yBot],3,C.eq);
  S(c,[x-3,yTop],[x+w+3,yTop],5,C.eqS);
  const n=9,ph=5.2,k=4;lift=Math.max(0,lift);
  for(let i=0;i<n;i++){const top=i>=n-k;const y=yBot-3-(i+1)*ph-(top?lift:0);RR(c,x+3,y,w-6,ph-1,1,C.eqFill,C.eq,1);}
  const yPin=yBot-3-(n-k+1)*ph-lift;S(c,[x+w/2,yPin],[x+w/2,yTop+4],2,C.eqS);
}
function pulley(c,C,p,r=4.5){CI(c,p,r,C.stage,C.eqS,2);CI(c,p,1.4,C.eqS);}

/* figure */
function drawSideFig(c,J,ex,C,layer){
  const hl=ex.hl||[],H=k=>hl.includes(k);
  const seg=(a,b,w,k,far)=>{if(far&&H(k)){c.globalAlpha=.5;S(c,a,b,w,C.acc);c.globalAlpha=1;}else S(c,a,b,w,H(k)?C.acc:(far?C.far:C.fig));};
  const leg=(l,far)=>{if(!l)return;seg(l.root,l.j,10,"thigh",far);seg(l.j,l.e,8.5,"shin",far);S(c,l.foot[0],l.foot[1],6,far?C.far:C.fig);};
  const arm=(a,far)=>{if(!a)return;seg(a.root,a.j,8,"uarm",far);seg(a.j,a.e,7,"farm",far);CI(c,a.e,3.8,far?C.far:C.fig);};
  if(layer==="far"){leg(J.legF,true);if(!ex.farArmFront)arm(J.armF,true);return;}
  if(layer==="body"){
    S(c,J.hip,J.sh,15,H("torso")?C.acc:C.fig);
    S(c,J.sh,J.neck,6,C.fig);CI(c,J.head,L.headR,C.fig);return;
  }
  if(layer==="near"){leg(J.legN,false);if(ex.farArmFront)arm(J.armF,true);arm(J.armN,false);}
}
function drawFrontFig(c,J,ex,C,layer){
  const hl=ex.hl||[],H=k=>hl.includes(k);
  if(layer==="far"){J.legs.forEach(l=>{S(c,l[0],l[1],J.p.seated?11:10,C.fig);S(c,l[1],l[2],8.5,C.fig);S(c,[l[2][0]-(l[2][0]<J.hip[0]?6:-6)*0,l[2][1]+1],[l[2][0]+(l[2][0]<J.hip[0]?-7:7),l[2][1]+2],6,C.fig);});return;}
  if(layer==="body"){
    const h=J.hip,sl=J.shL,sr=J.shR;
    POLY(c,[[sl[0]-4,sl[1]-3],[sr[0]+4,sr[1]-3],[h[0]+12,h[1]+2],[h[0]-12,h[1]+2]],H("torso")?C.acc:C.fig);
    CI(c,sl,6.5,C.fig);CI(c,sr,6.5,C.fig);
    S(c,J.sh,J.neck,7,C.fig);CI(c,J.head,L.headR,C.fig);return;
  }
  if(layer==="near"){[J.armF,J.armN].forEach(a=>{S(c,a.root,a.j,8,H("uarm")?C.acc:C.fig);S(c,a.j,a.e,7,H("farm")?C.acc:C.fig);CI(c,a.e,3.8,C.fig);});}
}
function drawTopFig(c,J,ex,C,layer){
  const hl=ex.hl||[],H=k=>hl.includes(k);
  if(layer==="near"){
    [J.armF,J.armN].forEach(a=>{S(c,a.root,a.j,8,H("uarm")?C.acc:C.fig);S(c,a.j,a.e,7,H("farm")?C.acc:C.fig);CI(c,a.e,3.8,C.fig);});
    S(c,J.shL,J.shR,19,H("torso")?C.acc:C.fig);
    CI(c,J.head,10.5,C.fig);
  }
}
function drawFig(c,J,ex,C,layer){if(J.view==="front")drawFrontFig(c,J,ex,C,layer);else if(J.view==="top")drawTopFig(c,J,ex,C,layer);else drawSideFig(c,J,ex,C,layer);}

  const M=lp(A,B,.5),d=sub(B,A),n=[-d[1],d[0]],nl=len(n);const P=add(M,[n[0]/nl,n[1]/nl],k);

  return {P,at:u=>[P[0]+r*Math.cos(a0+da*u),P[1]+r*Math.sin(a0+da*u)]};
}

 where:"A seated machine with an upright padded backrest and a padded roller bar down at ankle height. A stack of rectangular weights sits on one side with a pin in it. You sit facing out into the room, shins tucked behind the roller.",
 steps:["Adjust the seat so your knees line up with the round pivot point on the side of the machine.","Tuck your ankles behind the roller pad so it rests just above your feet, on your shins.","Hold the handles at your hips and sit back into the pad.","Straighten your legs fully, pause a second at the top and squeeze the front of your thighs.","Lower slowly — about 2 seconds down. Don't let the stack crash back."],
 tip:"Stop just short of the weight stack touching at the bottom. Keeping tension the whole set is what makes this one work.",photo:"seated leg extension machine gym"},
{id:"d1-legcurl",day:1,group:"Legs",name:"Leg Curl",wrote:"not in your routine — added",reps:"12–15",tags:["Machine"],rest:75,added:true,
 where:"Either a lying version where you lie face-down and a roller sits across your heels, or a seated version where you sit and push a pad down with the backs of your ankles. Weight stack at one end.",
 steps:["Lying version: lie face-down, hips flat on the pad.","Adjust the roller so it sits just above your heels, on your Achilles.","Grip the handles under the bench.","Curl your heels up toward your backside as far as they will go, squeezing the back of your thighs.","Lower slowly until your legs are almost straight. Keep your hips pressed down — no lifting your backside."],
 tip:"Your routine has no hamstring work at all, and that imbalance is how knee and hamstring problems start. That's why this sits right after leg extensions.",photo:"lying leg curl machine proper form"},
{id:"d1-legpress",day:1,group:"Legs",name:"Leg Press",wrote:"leg press",reps:"15",tags:["Machine","Plate-loaded"],rest:90,
 where:"A big angled machine, usually 45 degrees. You lie back into a padded seat low to the ground and a large flat metal footplate sits above you, loaded with plates on pegs at the sides. Two handles near your hips release the safety catches. Some gyms have a horizontal seated version with a weight stack — same idea.",
 steps:["Sit right back so your lower back and hips stay flat against the pad.","Place your feet on the middle of the plate, about shoulder-width apart.","Press the plate up, then rotate the side handles outward to release the safeties.","Lower slowly until your knees reach about 90 degrees and your thighs come toward your chest.","Stop before your lower back lifts or curls off the pad — that is your depth limit.","Press back up without snapping your knees straight. Re-engage the safeties before getting out."],
 tip:"Feet too low on the plate hammers the knees. Keep them mid-plate or slightly high, and never put your hands on your knees to push.",photo:"45 degree leg press machine proper form"},
{id:"d1-calf",day:1,group:"Legs",name:"Calf Press",wrote:"calves press",reps:"15",tags:["Machine"],rest:60,
 where:"Done on the same leg press machine. Alternatively look for a standing calf raise machine (you stand under two shoulder pads on a raised block) or a seated calf raise (you sit and a pad presses down on your thighs).",
 steps:["Set up in the leg press but slide your feet down so only the balls of your feet are on the bottom edge of the plate, heels hanging off in the air.","Keep the safety catches ON for this one, in case your feet slip.","Legs stay almost straight with just a slight knee bend — this is all ankle.","Push through the balls of your feet to point your toes away. Pause and squeeze at the top.","Let your heels sink back down slowly until you feel a proper stretch."],
 tip:"Calves respond to a slow, deep stretch at the bottom. Rushing this is why most people's calves never grow.",photo:"calf press on leg press machine form"},
{id:"d1-ohp",day:1,group:"Shoulders",name:"Overhead Press",wrote:"front shoulder press",reps:"15",tags:["Barbell","Rack"],rest:90,
 where:"A barbell set on rack hooks at shoulder height. Many gyms also have a dedicated shoulder press machine: you sit upright with handles beside your ears and push them up, with a weight stack at the back. Either works — the machine is easier for a beginner.",
 steps:["Set the bar at collarbone height. Grip just outside your shoulders, palms forward.","Unrack it and hold it resting on the front of your shoulders, elbows slightly ahead of the bar.","Tighten your stomach and squeeze your glutes so you don't lean back.","Press the bar straight up. Tuck your chin back slightly so it passes your face cleanly.","Finish with the bar directly over the back of your head, arms straight.","Lower under control back to your collarbones."],
 tip:"The bar travels in a straight vertical line, not forward in an arc. If you are arching your back a lot to get it up, the weight is too heavy.",photo:"standing barbell overhead press proper form"},
{id:"d1-dbpress",day:1,group:"Shoulders",name:"Dumbbell Shoulder Press",wrote:"dumble shoulder press",reps:"15",tags:["Dumbbells","Bench"],rest:75,
 where:"A pair of dumbbells from the rack, plus an adjustable bench. The back rest has a lever or pin at the back — set it almost fully upright, around 80–90 degrees.",
 steps:["Sit with your back flat against the pad, dumbbells resting on your thighs.","Kick them up one at a time to shoulder height, palms facing forward.","Elbows about 45 degrees out from your body, not flared straight out to the sides.","Press both up until your arms are nearly straight and the ends almost touch.","Lower until your upper arms are about level with your shoulders."],
 tip:"Start lighter than you think. Dumbbells wobble and demand more control than a barbell or machine.",photo:"seated dumbbell shoulder press proper form"},
{id:"d1-frontraise",day:1,group:"Shoulders",name:"Dumbbell Front Raise",wrote:"dumble front raise",reps:null,tags:["Dumbbells"],rest:0,ss:{k:"A",part:1,with:"d1-lateral"},
 where:"Two light dumbbells — genuinely light, 4–8 kg. Done standing, no other equipment needed.",
 steps:["Stand with the dumbbells in front of your thighs, palms facing your legs.","Keeping your arms nearly straight, lift them up in front of you to about eye level.","Do not swing or lean back to get them up.","Lower slowly, then go straight into the machine lateral raise with no rest."],
 tip:"A superset means both exercises back-to-back with no rest, then one rest before the next round.",photo:"dumbbell front raise shoulder exercise form"},
{id:"d1-lateral",day:1,group:"Shoulders",name:"Machine Lateral Raise",wrote:"machine side lateral",reps:null,tags:["Machine"],rest:75,ss:{k:"A",part:2,with:"d1-frontraise"},
 where:"A seated machine where you sit upright and push two pads outward with the outside of your upper arms. If your gym doesn't have one, use dumbbells or a cable at the lowest pulley instead.",
 steps:["Adjust the seat so your shoulder joints line up with the machine's pivot points.","Place your elbows and forearms against the pads.","Lead with your elbows, raising your arms out to the sides until level with your shoulders.","Pause at the top, lower slowly.","Keep your shoulders down — don't shrug them up to your ears."],
 tip:"Ego has no place here. Light weight, clean movement, and stop the moment your shoulders start shrugging.",photo:"machine lateral raise shoulder machine gym"},
{id:"d1-reardelt",day:1,group:"Shoulders",name:"Rear Delt Fly",wrote:"rare delt fly",reps:"15",tags:["Machine"],rest:60,
 where:"Usually the pec deck (chest fly) machine used backwards: you sit facing the pad with your chest against it and the handles out in front. Some gyms have a dedicated rear delt machine. No machine? Bend forward at the hips holding light dumbbells.",
 steps:["Set the handles so they are together out in front of you at shoulder height before you sit.","Sit chest-first against the pad, feet flat on the floor.","Grab the handles with arms straight out in front, palms facing each other.","Sweep your arms out and back in a wide arc, squeezing your shoulder blades together.","Keep your elbows almost locked the whole time — this is a fly, not a row.","Return slowly to the front."],
 tip:"This trains the back of your shoulders, which fixes rounded posture from desk work. Don't skip it because the weight feels embarrassingly light.",photo:"reverse pec deck rear delt fly machine"},

{id:"d2-pushup",day:2,group:"Chest",name:"Push-up",wrote:"pushup",reps:null,tags:["Bodyweight"],rest:0,bw:true,ss:{k:"B",part:1,with:"d2-dips"},
 where:"Floor space, ideally on a mat. No equipment.",
 steps:["Hands slightly wider than your shoulders, body in one straight line from head to heels.","Squeeze your glutes and stomach so your hips don't sag.","Lower until your chest is a few inches from the floor, elbows about 45 degrees from your ribs — not flared straight out.","Push back up. Drop to your knees if you can't hit your reps with good form.","Go straight into dips with no rest."],
 tip:"Hips sagging or riding up is the giveaway that your core has quit. Stop the set there rather than grinding out sloppy reps.",photo:"push up proper form"},
{id:"d2-dips",day:2,group:"Chest",name:"Parallel Bar Dips",wrote:"paralarbar",reps:null,tags:["Bodyweight","Dip bars"],rest:90,bw:true,ss:{k:"B",part:2,with:"d2-pushup"},
 where:"The dip station: two thick parallel bars roughly at waist height that you grip and hold yourself between. Often part of a tall frame with a pull-up bar above and a back pad. Many gyms have an assisted version with a knee platform.",
 steps:["Grip the bars and press up to straight arms.","Lean your torso forward about 20–30 degrees. That angle makes it a chest exercise; staying bolt upright makes it a triceps exercise.","Lower until your upper arms are roughly parallel to the floor and you feel a stretch across your chest.","Press back up without locking your elbows hard."],
 tip:"On the assisted dip machine you kneel on a pad and a counterweight helps you up — so picking more weight makes it easier, which feels backwards at first.",photo:"parallel bar chest dips proper form"},
{id:"d2-bench",day:2,group:"Chest",name:"Barbell Bench Press",wrote:"bence press",reps:"12",tags:["Barbell","Bench"],rest:0,ss:{k:"C",part:1,with:"d2-pecdeck"},
 where:"A flat padded bench sitting inside a rack, with a barbell on hooks above where your chest will be. The rack has adjustable safety bars — set them just above chest height before you start.",
 steps:["Lie back so your eyes are directly under the bar. Feet flat on the floor.","Pinch your shoulder blades together and down into the bench, leaving a small natural arch in your lower back.","Grip the bar a bit wider than your shoulders. Lift it off the hooks and hold it straight over your chest.","Lower the bar to your mid-chest, touching lightly. Elbows at roughly 45–70 degrees from your body.","Press back up over your chest.","Go straight into the machine fly with no rest."],
 tip:"Never bench alone with a weight you might fail on unless the safety bars are set. Asking someone on the floor for a spot is normal in every gym in the world.",photo:"barbell bench press proper form flat bench"},
{id:"d2-pecdeck",day:2,group:"Chest",name:"Machine Chest Fly",wrote:"machine fly",reps:"12",tags:["Machine","Pec deck"],rest:120,ss:{k:"C",part:2,with:"d2-bench"},
 where:"A seated machine with two vertical pads or handles beside you that swing together in front of your chest, with a weight stack behind the backrest.",
 steps:["Adjust the seat so the handles sit at chest height.","Sit with your back flat on the pad, elbows slightly bent.","Squeeze the handles together in front of your chest.","Pause one second at the middle.","Open slowly until you feel a stretch — stop before your shoulders roll forward."],
 tip:"Elbows stay at the same slight bend the whole set. If they are opening and closing, you have turned a fly into a press.",photo:"pec deck machine chest fly gym"},
{id:"d2-vpress",day:2,group:"Chest",name:"Vertical Chest Press",wrote:"vertical cest press",reps:"15",tags:["Machine"],rest:90,
 where:"A seated machine where you sit upright against a back pad and push two handles straight forward, away from your chest. Either a weight stack with a pin, or pegs for plates. The handles usually have two grip options.",
 steps:["Set the seat height so the handles line up with the middle of your chest, around nipple level. This is the setting people get wrong.","Sit with your back flat on the pad, feet planted.","Grip the handles and press forward until your arms are nearly straight. Don't snap your elbows locked.","Return slowly until your hands are beside your chest and you feel a stretch across the front.","Keep your shoulders pulled back and down against the pad throughout."],
 tip:"Because the machine holds the path for you, this is the safest place to push close to failure. Use it for your hardest sets of the day.",photo:"seated chest press machine proper form"},
{id:"d2-dbbench",day:2,group:"Chest",name:"Dumbbell Bench Press",wrote:"dumble bence press",reps:"12",tags:["Dumbbells","Bench"],rest:90,
 where:"A pair of dumbbells and a flat bench. Set the bench flat — no incline.",
 steps:["Sit on the end of the bench with a dumbbell standing on each thigh.","Lie back while kicking your knees up one at a time — that momentum brings the dumbbells safely to your shoulders.","Palms facing forward, elbows about 45 degrees out from your body.","Press up until your arms are almost straight and the dumbbells are over your chest.","Lower until your upper arms are level with your torso and you feel a chest stretch.","To finish: bring them back onto your thighs, then sit up using that momentum."],
 tip:"Never try to lower heavy dumbbells to the floor while still lying down. Thighs first, then sit up.",photo:"flat dumbbell bench press proper form"},
{id:"d2-ohtri",day:2,group:"Triceps",name:"Overhead Triceps Extension",wrote:"overhead dumble tricep",reps:"15",tags:["Dumbbell","Bench"],rest:75,
 where:"One medium dumbbell held in both hands. An adjustable bench with the back set upright makes it far more stable than standing.",
 steps:["Sit upright with your back against the pad.","Hold one dumbbell with both hands cupped under the top plate, like holding a cup.","Press it straight up overhead until your arms lock out.","Keeping your elbows pointed forward and close to your head, bend at the elbows and lower it behind your head.","Go until you feel a real stretch down the back of your arms, then extend back up.","Only your forearms move. Upper arms stay put."],
 tip:"Elbows will want to flare out sideways as you tire. Keeping them tucked beside your head is the whole exercise.",photo:"seated overhead dumbbell triceps extension form"},
{id:"d2-pushdown",day:2,group:"Triceps",name:"Cable Pushdown",wrote:"cable push down",reps:"15",tags:["Cable","Straight bar"],rest:60,
 where:"The cable machine — a tall frame with a pulley that slides up and down a column, a weight stack with a pin, and attachments hanging nearby. Slide the pulley to the top and clip on the short straight bar or the angled bar.",
 steps:["Stand facing the machine, half a step back, one foot slightly forward.","Grab the bar overhand at shoulder width.","Pin your elbows against your sides. They stay glued there for every rep.","Push the bar down until your arms are fully straight, squeezing at the bottom.","Let it rise slowly to about chest height, elbows still tucked.","Don't lean your bodyweight over the bar to help."],
 tip:"Elbows drifting forward turns this into a chest exercise. Imagine they are pinned to your ribs with nails.",photo:"cable triceps pushdown straight bar form"},
{id:"d2-rope",day:2,group:"Triceps",name:"Rope Pushdown",wrote:"rope push down",reps:"15",tags:["Cable","Rope"],rest:60,
 where:"Same cable machine, same top pulley. Swap the bar for the rope attachment — a thick braided rope with rubber stoppers on each end.",
 steps:["Set up exactly as the bar pushdown, elbows locked at your sides.","Hold the rope with palms facing each other, thumbs near the stoppers.","Push down, and as you reach the bottom pull the two rope ends apart and slightly behind you.","Turn your pinkies outward at the very bottom and squeeze hard for a second.","Return slowly with the rope ends coming back together."],
 tip:"Spreading the rope at the bottom is what makes this different from the straight bar. If you finish with the ends still touching, you are doing the same exercise twice.",photo:"rope triceps pushdown cable machine form"},
{id:"d2-onearm",day:2,group:"Triceps",name:"Single-Arm Pushdown",wrote:"one arm tricep",reps:"15 each arm",tags:["Cable","D-handle"],rest:60,
 where:"Same cable machine, top pulley, but clip on a single D-handle — a small stirrup-shaped handle.",
 steps:["Grab the handle with one hand, palm up (underhand) or down — both work.","Hold the machine frame with your free hand for balance.","Pin your working elbow tight to your side.","Straighten the arm fully down, squeeze, then let it return slowly.","Complete all reps on one arm, then switch."],
 tip:"One arm at a time lets you see whether one side is noticeably weaker — and fix it before it becomes a habit.",photo:"single arm cable triceps pushdown form"},
{id:"d2-wrist",day:2,group:"Triceps",name:"Wrist Curl",wrote:"wrist curl",reps:"20",tags:["Barbell","Bench"],rest:60,
 where:"A light barbell or EZ bar, or a pair of light dumbbells. Kneel beside a flat bench and rest your forearms along it, or sit and rest your forearms on your thighs.",
 steps:["Sit with forearms flat on your thighs, palms up, wrists hanging just past your knees.","Hold the bar with a loose grip.","Let it roll down toward your fingertips, opening your hand slightly.","Curl it back up by closing your fingers and flexing your wrist upward.","The range is small. Keep your forearms pressed down — nothing above the wrist moves."],
 tip:"Forearms recover fast, which is why this one is set at 20 reps. Go light and chase the burn, not the weight.",photo:"seated barbell wrist curl forearm exercise"},

{id:"d3-pulldown",day:3,group:"Back",name:"Lat Pulldown",wrote:"let pull down",reps:"15",tags:["Machine","Cable"],rest:90,
 where:"A seated station with a long, wide bar hanging from a high pulley above your head, and a padded thigh brace that clamps over your legs so the weight can't pull you off the seat. Weight stack with a pin at the side.",
 steps:["Adjust the thigh pad so it presses down firmly on your legs when seated.","Stand up, grab the bar overhand a good bit wider than your shoulders, then sit down with it.","Sit tall, chest up, lean back just slightly — around 10 to 20 degrees, no more.","Pull the bar down to your upper chest by driving your elbows down and back toward your hips.","Squeeze your shoulder blades together at the bottom.","Let the bar rise all the way up until your arms are straight and you feel your lats stretch."],
 tip:"Never pull the bar behind your neck — it is hard on the shoulder joint and gives you nothing extra. Front of the chest, always.",photo:"lat pulldown machine proper form"},
{id:"d3-bentrow",day:3,group:"Back",name:"Bent-Over Barbell Row",wrote:"bend over row",reps:"15",tags:["Barbell"],rest:120,
 where:"A barbell loaded on the floor, or resting on low rack hooks at around knee height. Free floor space with rubber matting.",
 steps:["Stand with feet hip-width, bar over the middle of your feet.","Push your hips backward and bend your knees slightly, letting your torso tip forward to about 45 degrees or lower.","Keep your back flat and chest proud — a rounded lower back here is the classic way people hurt themselves.","Grip the bar overhand, just outside your legs.","Pull the bar up to your lower ribs or belly button, driving your elbows back behind you.","Lower under control. Your torso angle must not change between reps."],
 tip:"Go noticeably lighter than you expect. If you can't hold a flat back for 15 reps, use a chest-supported row machine until your back is stronger.",photo:"bent over barbell row proper form back"},
{id:"d3-cablerow",day:3,group:"Back",name:"Seated Cable Row",wrote:"seated cable row",reps:"15",tags:["Cable","V-handle"],rest:120,
 where:"A low pulley station: you sit on a long narrow bench, with a footplate to brace against in front of you and the cable coming out low at floor level. The usual attachment is a V-shaped triangle handle.",
 steps:["Sit with feet braced on the plate, knees slightly bent.","Lean forward to grab the handle, then sit up tall with your arms extended in front.","Chest out, shoulders down. Pull the handle to your belly button.","Keep your elbows brushing close to your sides and squeeze your shoulder blades together at the end.","Extend your arms forward slowly, letting your shoulder blades spread — but don't let your lower back round over."],
 tip:"Your torso stays basically upright the whole set. Rocking backward to yank the weight is the most common mistake on this machine.",photo:"seated cable row v bar proper form"},
{id:"d3-lowrow",day:3,group:"Back",name:"Low Row, Neutral Grip",wrote:"low row (double hand)",reps:"15",tags:["Machine"],rest:120,
 where:"A seated row machine with a chest pad in front of you and two separate handles, one for each hand, gripped with palms facing each other. Either a weight stack or plates on pegs. The pulling angle is from low up toward your hips.",
 steps:["Set the seat so the handles sit at lower-chest or upper-belly level.","Sit chest against the pad, feet planted firmly.","Take one handle in each hand, palms facing inward.","Pull both handles back toward your hips, elbows close to your body.","Squeeze your shoulder blades together, hold a second.","Extend your arms forward slowly for a full stretch each rep."],
 tip:"The chest pad means your lower back does nothing here. That makes it a good place to push hard after bent-over rows have already tired your back.",photo:"plate loaded low row machine back exercise"},
{id:"d3-bbcurl",day:3,group:"Biceps",name:"Barbell Curl",wrote:"barbel curl",reps:"20",tags:["Barbell","EZ bar"],rest:75,
 where:"A straight barbell, or better, the EZ curl bar — the shorter bar with a zig-zag wave in the middle. The angled grips are much kinder on your wrists.",
 steps:["Stand tall, feet hip-width, holding the bar underhand at shoulder width.","Let your arms hang straight with the bar resting against your thighs.","Pin your elbows at your sides and curl the bar up toward your chest.","Squeeze hard at the top for a second.","Lower slowly until your arms are completely straight — full range every rep.","No swinging your hips, no leaning back."],
 tip:"20 reps is a lot of reps. Pick a weight that feels almost too easy on rep 5, because rep 18 will change your mind.",photo:"standing barbell curl proper form biceps"},
{id:"d3-preacher",day:3,group:"Biceps",name:"Preacher Curl",wrote:"peacher curl",reps:"15",tags:["Bench","Barbell"],rest:75,
 where:"The preacher bench: a seat with a wide, steeply angled padded armrest in front of it, shaped a bit like a lectern. Some have a weight stack attached; others are just a bench where you use an EZ bar.",
 steps:["Set the seat height so the top edge of the pad sits right under your armpits.","Rest your upper arms flat on the pad, chest leaning against it.","Take the bar underhand at shoulder width.","Curl up until the bar is around chin height, squeezing at the top.","Lower slowly until your arms are nearly straight — but stop just short of fully locked out."],
 tip:"Never drop the weight fast at the bottom on this one. The stretched bottom position with a locked-straight arm is where biceps tears happen.",photo:"preacher curl bench ez bar form"},
{id:"d3-dbcurl",day:3,group:"Biceps",name:"Dumbbell Curl",wrote:"dumble curl",reps:"12 per arm",tags:["Dumbbells"],rest:75,
 where:"A pair of dumbbells. Standing, or seated on the end of a flat bench.",
 steps:["Hold the dumbbells at your sides, palms facing forward.","Keep your elbows tucked and upper arms still.","Curl one dumbbell up to shoulder height, squeeze, then lower it slowly.","Repeat with the other arm — alternating left, right, left, right.","Stand upright. No swinging your torso to get the weight moving."],
 tip:"Count 12 per arm for 24 total. Sitting down makes it much harder to cheat with your body.",photo:"alternating dumbbell biceps curl proper form"},
{id:"d3-hammer",day:3,group:"Biceps",name:"Hammer Curl",wrote:"hammer curl",reps:"12 per arm",tags:["Dumbbells"],rest:75,
 where:"Same pair of dumbbells. No setup needed.",
 steps:["Hold the dumbbells at your sides with palms facing each other — like holding a hammer.","Keep that grip the whole way through. No rotating.","Curl one dumbbell up toward your shoulder, elbow tucked.","Squeeze, then lower slowly.","Alternate arms, 12 each."],
 tip:"This hits the outer arm and the top of your forearm, which is what makes arms look thicker from the side. That is why it sits right after standard curls.",photo:"dumbbell hammer curl proper form"}
];

const EX={};
RAW.forEach(r=>{const ex=Object.assign({},r,ANIM[r.id]);ex.sets=3;EX[r.id]=ex;});
const dayList=n=>RAW.filter(r=>r.day===n).map(r=>EX[r.id]);
function prep(ex){
  if(ex._ready)return;ex._ready=true;if(ex.init)ex.init(ex);
  ex.J0=solve(ex,ex.pose(0,0,ex));ex.J1=solve(ex,ex.pose(1,0,ex));
  const pts=[];for(let i=0;i<=30;i++){const u=i/30,J=solve(ex,ex.pose(u,0,ex));pts.push(ex.keyFn?ex.keyFn(J,u):ex.key(J));}ex.trail=pts;
  ex.T=ex.tempo.reduce((a,b)=>a+b,0);
  const P=[];[0,.5,1].forEach(u=>{const J=solve(ex,ex.pose(u,ex.alt?1-u:0,ex));
    ["hip","sh","shR","shL","c"].forEach(k=>J[k]&&P.push(J[k]));if(J.head)P.push(add(J.head,[0,-11]));
    ["legN","legF","armN","armF"].forEach(k=>{const l=J[k];if(l){P.push(l.j,l.e);if(l.foot)P.push(...l.foot);}});
    if(J.legs)J.legs.forEach(l=>P.push(...l));});
  if(ex.view!=="top")P.push([P[0][0],200]);
  let x0=Math.min(...P.map(p=>p[0]))-16,x1=Math.max(...P.map(p=>p[0]))+16,y0=Math.min(...P.map(p=>p[1]))-12,y1=Math.max(...P.map(p=>p[1]))+10;
  const z=Math.max(1,Math.min(2.1,320/(x1-x0),220/(y1-y0)));ex.tcam={z,x:(x0+x1)/2,y:(y0+y1)/2};
}
function phaseAt(ex,t){
  const [a,b,c,d]=ex.tempo,T=a+b+c+d;let x=((t%T)+T)%T;
  if(x<a)return {u:easeIO(x/a),i:0};x-=a;
  if(x<b)return {u:1,i:1};x-=b;
  if(x<c)return {u:1-easeIO(x/c),i:2};
  return {u:0,i:3};
}
const setLabel=ex=>ex.ss?"Round":"Set";
const repsText=ex=>ex.reps?`3 × ${ex.reps}`:"3 rounds";

let PAL=null;
function readPal(){
  const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  PAL={fig:g("--fig"),far:g("--fig-far"),eq:g("--eq"),eqS:g("--eq-strong"),eqFill:g("--eq-fill"),floor:g("--floor"),line:g("--line"),stage:g("--stage"),plateFill:g("--plate-fill"),
       d1:g("--d1"),d2:g("--d2"),d3:g("--d3"),add:g("--add")};
}
function drawScene(ctx,ex,t,W,H,opts={}){
  prep(ex);
  const C=Object.assign({},PAL,{acc:ex.added?PAL.add:PAL["d"+ex.day]});
  const ph=opts.u!=null?{u:opts.u,i:0}:phaseAt(ex,t);
  const u2=ex.alt?(opts.u!=null?0:phaseAt(ex,t+ex.T/2).u):0;
  const cam=(opts.thumb?ex.tcam:ex.cam)||{},z=cam.z||1,cx=cam.x??160,cy=cam.y??110,s=W/320*z;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  ctx.setTransform(s,0,0,s,W/2-cx*s,H/2-cy*s);ctx.lineCap="round";ctx.lineJoin="round";
  if(ex.view!=="top"){ctx.fillStyle=C.floor;ctx.fillRect(-400,200,1200,400);S(ctx,[-400,200],[800,200],1.5,C.line);}
  const J=solve(ex,ex.pose(ph.u,u2,ex));
  if(ex.back)ex.back(ctx,J,ph.u,C,ex);
  drawFig(ctx,J,ex,C,"far");
  drawFig(ctx,J,ex,C,"body");
  if(ex.mid)ex.mid(ctx,J,ph.u,C,ex);
  drawFig(ctx,J,ex,C,"near");
  if(ex.front)ex.front(ctx,J,ph.u,C,ex);
  if(opts.trail&&ex.trail){
    ctx.save();ctx.globalAlpha=.75;ctx.setLineDash([3,4]);PL(ctx,ex.trail,1.6,C.acc);ctx.setLineDash([]);
    const a=ex.trail[ex.trail.length-1],b=ex.trail[ex.trail.length-4],v=sub(a,b),vl=len(v)||1,n=[v[0]/vl,v[1]/vl];
    POLY(ctx,[add(a,n,3),add(add(a,n,-4),[-n[1],n[0]],3.5),add(add(a,n,-4),[n[1],-n[0]],3.5)],C.acc,null);ctx.restore();

}

const players=new Set();
let ro=null,io=null;
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
class Player{
  constructor(canvas,ex,o={}){
    this.c=canvas;this.ctx=canvas.getContext("2d");this.ex=ex;this.t=o.t0||0;this.playing=!!o.play;this.speed=1;this.trail=!!o.trail;this.vis=true;this.dirty=true;this.onPhase=o.onPhase;this.lastI=-1;this.staticU=o.staticU;this.thumb=!!o.thumb;
    players.add(this);ro.observe(canvas);this.fit();if(o.lazy){this.tick(0);this.vis=false;io.observe(canvas);}
  }
  fit(){const r=this.c.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5);const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(this.c.width!==w||this.c.height!==h){this.c.width=w;this.c.height=h;}this.dirty=true;}
  tick(dt){
    if(this.playing){this.t+=dt*this.speed;this.dirty=true;}
    if(!this.vis||!this.dirty)return;this.dirty=false;
    const ph=drawScene(this.ctx,this.ex,this.t,this.c.width,this.c.height,{trail:this.trail,thumb:this.thumb,u:this.playing?null:this.staticU});
    if(this.onPhase)this.onPhase(ph,this);
  }
}
function resetPlayers(){players.clear();if(ro)ro.disconnect();if(io)io.disconnect();
  ro=new ResizeObserver(es=>es.forEach(e=>{players.forEach(p=>{if(p.c===e.target)p.fit();});}));
  io=new IntersectionObserver(es=>es.forEach(e=>{players.forEach(p=>{if(p.c===e.target){p.vis=e.isIntersecting;p.dirty=true;}});}),{rootMargin:"80px"});
}
let lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;players.forEach(p=>p.tick(dt));requestAnimationFrame(loop);}

function startRest(sec,msg){if(!sec)return;rest.total=sec;rest.end=Date.now()+sec*1000;rest.msg=msg;restMsg.textContent=msg;restEl.hidden=false;clearInterval(rest.iv);rest.iv=setInterval(tickRest,250);tickRest();}
function stopRest(){clearInterval(rest.iv);restEl.hidden=true;}
function tickRest(){const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){clearInterval(rest.iv);restTime.textContent="Go";restMsg.textContent="Rest over. Start your next set.";ringFg.style.strokeDashoffset=131.95;beep();if(navigator.vibrate)try{navigator.vibrate([180,90,180]);}catch(e){}setTimeout(()=>{if(Date.now()>=rest.end)restEl.hidden=true;},6000);return;}
  restTime.textContent=fmt(left);ringFg.style.strokeDashoffset=131.95*(1-left/rest.total);}
document.getElementById("restAdd").onclick=()=>{if(Date.now()>rest.end){rest.end=Date.now();rest.total=0;clearInterval(rest.iv);rest.iv=setInterval(tickRest,250);restMsg.textContent=rest.msg;}rest.end+=15000;rest.total+=15;tickRest();};
document.getElementById("restSkip").onclick=stopRest;

/* routing */
function route(){
  resetPlayers();
  const parts=(location.hash.slice(1)||"/").split("/").filter(Boolean);
  const isEx=parts[0]==="ex"&&EX[parts[1]];
  if(isEx)renderDetail(EX[parts[1]]);
  else if(parts[0]==="basics")renderBasics();
  else renderHome(Math.min(3,Math.max(1,+(parts[1])||state.day||1)));
  wireInstall();setWake(!!isEx);
  const v=app.firstElementChild;if(v){v.classList.add(isEx?"enter-push":"enter-tab");}
  window.scrollTo(0,0);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readPal();players.forEach(p=>p.dirty=true);});
applyTheme();
window.addEventListener("hashchange",route);
route();
requestAnimationFrame(loop);
</script>
<script>
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
